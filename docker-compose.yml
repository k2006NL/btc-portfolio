services:
  bitcoind:
    image: bitcoin/bitcoin:latest
    command:
      - -printtoconsole
      - -regtest=1
      - -server=1
      - -txindex=1            # 任意の取引をtxidで引けるようにする(取り込みで使う)
      - -fallbackfee=0.0001   # regtestで手数料推定が無くても送金できるように
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=${BTC_RPC_USER}
      - -rpcpassword=${BTC_RPC_PASSWORD}
    ports:
      - "18443:18443"   # JSON-RPC
    volumes:
      - btc-data:/home/bitcoin/.bitcoin

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  btc-data:
  pg-data:
